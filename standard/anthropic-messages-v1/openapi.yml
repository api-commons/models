openapi: 3.1.0
info:
  title: The Anthropic Messages Dialect — API Commons profile
  summary: The interoperable surface of the Anthropic API, as adopters actually implement it.
  description: 'A **profile**, not a copy. The Anthropic API became a de facto standard by being implemented
    by other people; this describes the part of it that the industry actually built, with every operation
    graded `x-tier` core or extended by measured adoption. Vendor-tier operations are documented in `profile.yml`
    and deliberately excluded here.


    Derived from https://github.com/anthropics/anthropic-sdk-python at commit `eb21a4352015686c30f5759e8c2f02d70f5371e2`
    (MIT). Not published by, affiliated with, or endorsed by Anthropic.


    See https://github.com/api-commons/models for the profile and the adopter registry.'
  version: 0.0.0+eb21a4352015
  contact:
    name: API Commons
    url: https://apicommons.org
  license:
    name: CC-BY-NC-SA-4.0
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/
externalDocs:
  description: The profile on API Commons
  url: https://apicommons.org/standards/models/
servers:
- url: https://api.anthropic.com
paths:
  /v1/messages:
    post:
      summary: Create a Message
      description: 'Send a structured list of input messages with text and/or image content, and the model
        will generate the next message in the conversation.


        The Messages API can be used for either single queries or stateless multi-turn conversations.


        Learn more about the Messages API in our [user guide](https://platform.claude.com/docs/en/get-started)'
      operationId: messages_post
      parameters:
      - name: anthropic-version
        in: header
        required: false
        schema:
          type: string
          description: 'The version of the Claude API you want to use.


            Read more about versioning and our version history [here](https://platform.claude.com/docs/en/api/versioning).'
          title: Anthropic-Version
        description: 'The version of the Claude API you want to use.


          Read more about versioning and our version history [here](https://platform.claude.com/docs/en/api/versioning).'
      - name: anthropic-user-profile-id
        in: header
        required: false
        schema:
          type: string
          description: The user profile ID to attribute this request to. Use when acting on behalf of
            a party other than your organization. Requires the `user-profiles` beta header.
          title: Anthropic-User-Profile-Id
          x-stainless-param: user_profile_id
        description: The user profile ID to attribute this request to. Use when acting on behalf of a
          party other than your organization. Requires the `user-profiles` beta header.
      - name: anthropic-workspace-id
        in: header
        required: false
        schema:
          type: string
          x-stainless-param: workspace_id
        description: 'Optional header to select the Workspace for this request. The value is a Workspace
          ID (for example, `wrkspc_011CZkZaBF1tNoB5wlCeusgy`).


          Only needed for credentials that can act on more than one Workspace. A credential that belongs
          to a specific Workspace may omit it; if sent, it must match that Workspace.'
        example: wrkspc_011CZkZaBF1tNoB5wlCeusgy
      responses:
        '200':
          description: Message object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Invalid argument - The client specified an invalid argument
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated - The request does not have valid authentication credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Permission denied - The caller does not have permission to execute the specified
            operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found - Some requested entity was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '408':
          description: Deadline exceeded - The deadline expired before the operation could complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Aborted - The operation was aborted due to concurrency issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          description: Failed precondition - Operation was rejected because the system is not in required
            state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Out of range - Operation was attempted past the valid range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Resource exhausted - Some resource has been exhausted (rate limiting)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '431':
          description: Request header fields too large - Request metadata was too large
          content:
            application/json:
              schema:
