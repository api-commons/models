            See [extended thinking](https://platform.claude.com/docs/en/build-with-claude/extended-thinking)
            for details.'
          title: Signature
          type: string
        thinking:
          description: The text of Claude's thinking process for this block.
          title: Thinking
          type: string
        type:
          const: thinking
          default: thinking
          title: Type
          type: string
      required:
      - signature
      - thinking
      - type
      title: ResponseThinkingBlock
      type: object
    RefusalCategory:
      description: The policy category that triggered a refusal.
      enum:
      - cyber
      - bio
      - frontier_llm
      - reasoning_extraction
      - general_harms
      title: RefusalCategory
      type: string
      x-enum-descriptions:
      - The request could enable cyber harm, such as malware or exploit development. Benign cybersecurity
        work can also trigger this category.
      - The request could enable biological harm, such as dangerous lab methods. Beneficial life sciences
        work can also trigger this category.
      - The request could assist the development of competing AI models, which is restricted under [Anthropic's
        commercial terms](https://www.anthropic.com/legal/commercial-terms). Benign machine learning work
        can also trigger this category.
      - The request asks the model to reproduce its internal reasoning in the response text. To get reasoning
        in a structured form instead, use [adaptive thinking](https://platform.claude.com/docs/en/build-with-claude/adaptive-thinking).
      - The request could be related to an area that was determined as harmful. Benign work might sometimes
        trigger this category.
