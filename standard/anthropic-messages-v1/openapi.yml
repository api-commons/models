components:
  schemas:
    CompletionResponse:
      properties:
        completion:
          type: string
          title: Completion
          description: The resulting completion up to and excluding the stop sequences.
          examples:
          - ' Hello! My name is Claude.'
        id:
          type: string
          title: Id
          description: 'Unique object identifier.


            The format and length of IDs may change over time.'
        model:
          $ref: '#/components/schemas/Model'
        stop_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Stop Reason
          description: 'The reason that we stopped.


            This may be one the following values:

            * `"stop_sequence"`: we reached a stop sequence — either provided by you via the `stop_sequences`
            parameter, or a stop sequence built into the model

            * `"max_tokens"`: we exceeded `max_tokens_to_sample` or the model''s maximum'
          examples:
          - stop_sequence
        type:
          type: string
          const: completion
          title: Type
          description: 'Object type.


            For Text Completions, this is always `"completion"`.'
          default: completion
      type: object
      required:
      - completion
      - id
      - model
      - stop_reason
      - type
      title: CompletionResponse
      example:
        completion: ' Hello! My name is Claude.'
        id: compl_018CKm6gsux7P8yMcwZbeCPw
        model: claude-2.1
        stop_reason: stop_sequence
        type: completion
    BrowserSwitchTabConfig:
