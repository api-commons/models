# A minimal spec that reaches the core tier of the Anthropic Messages dialect.
openapi: 3.1.0
info:
  title: Example Messages API
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /v1/messages:
    post:
      operationId: createMessage
      summary: Create a message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages, max_tokens]
              properties:
                model:
                  type: string
                max_tokens:
                  type: integer
                messages:
                  type: array
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role:
                        type: string
                        enum: [user, assistant]
                      content:
                        type: string
      responses:
        '200':
          description: A message.
          content:
            application/json:
              schema:
                type: object
                required: [id, content, role]
                properties:
                  id:
                    type: string
                  role:
                    type: string
                  stop_reason:
                    type: string
                  content:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        text:
                          type: string
  /v1/models:
    get:
      operationId: listModels
      responses:
        '200':
          description: The model list.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id]
                      properties:
                        id:
                          type: string
