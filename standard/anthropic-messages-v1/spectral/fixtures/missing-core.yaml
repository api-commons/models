# Claims the dialect and declares neither core operation.
openapi: 3.1.0
info:
  title: Compatible In Name Only
  version: 1.0.0
  description: The README says Anthropic-compatible. The spec does not.
paths:
  /v1/generate:
    post:
      operationId: generate
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
      responses:
        '200':
          description: Text.
