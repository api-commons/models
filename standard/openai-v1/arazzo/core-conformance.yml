arazzo: 1.0.1
info:
  title: OpenAI interface core conformance
  version: 1.0.0
  summary: Discover a model, then use it. The smallest flow that proves core-tier support.
  description: Run this against a provider that claims compatibility. Step one reads the model list and
    takes the first identifier it offers, so the flow never hardcodes a model name that only one provider
    serves. Step two sends the smallest possible request with it. A provider that completes both steps
    supports the interoperable core of this interface; a provider that cannot has no basis for the claim.
sourceDescriptions:
- name: profile
  url: ./openapi.yml
  type: openapi
workflows:
- workflowId: core-conformance
  summary: List models, then send the smallest request with the first one.
  description: 'Both core operations in the order a real client uses them: GET /models (71.7% of the cohort)
    then POST /chat/completions (87.5%).'
  inputs:
    type: object
    properties:
      prompt:
        type: string
        default: 'Reply with the word: ok'
  steps:
  - stepId: listModels
    description: GET /models — declared by 71.7% of the cohort.
    operationId: $sourceDescriptions.profile.listModels
    successCriteria:
    - condition: $statusCode == 200
    - context: $response.body
      condition: $.data[0].id
      type: jsonpath
    outputs:
      modelId: $response.body#/data/0/id
  - stepId: createChatCompletion
    description: POST /chat/completions — declared by 87.5% of the cohort.
    operationId: $sourceDescriptions.profile.createChatCompletion
    requestBody:
      contentType: application/json
      payload:
        model: $steps.listModels.outputs.modelId
        messages:
        - role: user
          content: $inputs.prompt
    successCriteria:
    - condition: $statusCode == 200
    - context: $response.body
      condition: $.choices[0].message.content
      type: jsonpath
    outputs:
      reply: $response.body#/choices/0/message/content
  outputs:
    model: $steps.listModels.outputs.modelId
    reply: $steps.createChatCompletion.outputs.reply
