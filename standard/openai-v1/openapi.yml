openapi: 3.1.0
info:
  title: The OpenAI Interface — API Commons profile
  summary: The interoperable surface of the OpenAI API, as adopters actually implement it.
  description: 'A **profile**, not a copy. The OpenAI API became a de facto standard by being implemented
    by other people; this describes the part of it that the industry actually built, with every operation
    graded `x-tier` core or extended by measured adoption. Vendor-tier operations are documented in `profile.yml`
    and deliberately excluded here.


    Derived from https://github.com/openai/openai-openapi at commit `38170fdddbb6a1813eae6c6587ee17cf2987185b`
    (MIT). Not published by, affiliated with, or endorsed by OpenAI.


    See https://github.com/api-commons/models for the profile and the adopter registry.'
  version: 2.3.0
  contact:
    name: API Commons
    url: https://apicommons.org
  license:
    name: CC-BY-NC-SA-4.0
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/
externalDocs:
  description: The profile on API Commons
  url: https://apicommons.org/standards/models/
servers:
- url: https://api.openai.com/v1
paths:
  /audio/speech:
    post:
      operationId: createSpeech
      tags:
      - Audio
      summary: Create speech
      description: 'Generates audio from the input text.


        Returns the audio file content, or a stream of audio events.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSpeechRequest'
      responses:
        '200':
          description: OK
          headers:
            Transfer-Encoding:
              schema:
                type: string
              description: chunked
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/event-stream:
              schema:
                $ref: '#/components/schemas/CreateSpeechResponseStreamEvent'
        '429':
          $ref: '#/components/responses/InferenceRateLimited'
        '503':
          $ref: '#/components/responses/InferenceServiceUnavailable'
      x-oaiMeta:
        group: audio
        examples:
        - title: Default
          request:
            curl: "curl https://api.openai.com/v1/audio/speech \\\n  -H \"Authorization: Bearer $OPENAI_API_KEY\"
              \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"model\": \"gpt-4o-mini-tts\",\n
              \   \"input\": \"The quick brown fox jumped over the lazy dog.\",\n    \"voice\": \"alloy\"\n
              \ }' \\\n  --output speech.mp3\n"
            python: "from pathlib import Path\nimport openai\n\nspeech_file_path = Path(__file__).parent
              / \"speech.mp3\"\nwith openai.audio.speech.with_streaming_response.create(\n  model=\"gpt-4o-mini-tts\",\n
              \ voice=\"alloy\",\n  input=\"The quick brown fox jumped over the lazy dog.\"\n) as response:\n
              \ response.stream_to_file(speech_file_path)\n"
            javascript: "import fs from \"fs\";\nimport path from \"path\";\nimport OpenAI from \"openai\";\n\nconst
              openai = new OpenAI();\n\nconst speechFile = path.resolve(\"./speech.mp3\");\n\nasync function
              main() {\n  const mp3 = await openai.audio.speech.create({\n    model: \"gpt-4o-mini-tts\",\n
              \   voice: \"alloy\",\n    input: \"Today is a wonderful day to build something people love!\",\n
              \ });\n  console.log(speechFile);\n  const buffer = Buffer.from(await mp3.arrayBuffer());\n
              \ await fs.promises.writeFile(speechFile, buffer);\n}\nmain();\n"
            csharp: "using System;\nusing System.IO;\n\nusing OpenAI.Audio;\n\nAudioClient client = new(\n
              \   model: \"gpt-4o-mini-tts\",\n    apiKey: Environment.GetEnvironmentVariable(\"OPENAI_API_KEY\")\n);\n\nBinaryData
              speech = client.GenerateSpeech(\n    text: \"The quick brown fox jumped over the lazy dog.\",\n
              \   voice: GeneratedSpeechVoice.Alloy\n);\n\nusing FileStream stream = File.OpenWrite(\"speech.mp3\");\nspeech.ToStream().CopyTo(stream);\n"
        - title: SSE Stream Format
          request:
            curl: "curl https://api.openai.com/v1/audio/speech \\\n  -H \"Authorization: Bearer $OPENAI_API_KEY\"
              \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"model\": \"gpt-4o-mini-tts\",\n
              \   \"input\": \"The quick brown fox jumped over the lazy dog.\",\n    \"voice\": \"alloy\",\n
              \   \"stream_format\": \"sse\"\n  }'\n"
      x-tier: extended
  /audio/transcriptions:
    post:
      operationId: createTranscription
      tags:
      - Audio
      summary: Create transcription
      description: 'Transcribes audio into the input language.


        Returns a transcription object in `json`, `diarized_json`, or `verbose_json`

        format, or a stream of transcript events.

        '
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateTranscriptionRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/CreateTranscriptionResponseJson'
                - $ref: '#/components/schemas/CreateTranscriptionResponseDiarizedJson'
                - $ref: '#/components/schemas/CreateTranscriptionResponseVerboseJson'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/CreateTranscriptionResponseStreamEvent'
        '429':
          $ref: '#/components/responses/InferenceRateLimited'
        '503':
          $ref: '#/components/responses/InferenceServiceUnavailable'
      x-oaiMeta:
        group: audio
        examples:
        - title: Default
          request:
            curl: "curl https://api.openai.com/v1/audio/transcriptions \\\n  -H \"Authorization: Bearer
              $OPENAI_API_KEY\" \\\n  -H \"Content-Type: multipart/form-data\" \\\n  -F file=\"@/path/to/file/audio.mp3\"
              \\\n  -F model=\"gpt-4o-transcribe\"\n"
            python: "from openai import OpenAI\nclient = OpenAI()\n\naudio_file = open(\"speech.mp3\",
              \"rb\")\ntranscript = client.audio.transcriptions.create(\n  model=\"gpt-4o-transcribe\",\n
              \ file=audio_file\n)\n"
            javascript: "import fs from \"fs\";\nimport OpenAI from \"openai\";\n\nconst openai = new
              OpenAI();\n\nasync function main() {\n  const transcription = await openai.audio.transcriptions.create({\n
              \   file: fs.createReadStream(\"audio.mp3\"),\n    model: \"gpt-4o-transcribe\",\n  });\n\n
              \ console.log(transcription.text);\n}\nmain();\n"
            csharp: "using System;\n\nusing OpenAI.Audio;\nstring audioFilePath = \"audio.mp3\";\n\nAudioClient
              client = new(\n    model: \"gpt-4o-transcribe\",\n    apiKey: Environment.GetEnvironmentVariable(\"OPENAI_API_KEY\")\n);\n\nAudioTranscription
              transcription = client.TranscribeAudio(audioFilePath);\n\nConsole.WriteLine($\"{transcription.Text}\");\n"
          response: "{\n  \"text\": \"Imagine the wildest idea that you've ever had, and you're curious
            about how it might scale to something that's a 100, a 1,000 times bigger. This is a place
            where you can get to do that.\",\n  \"usage\": {\n    \"type\": \"tokens\",\n    \"input_tokens\":
            14,\n    \"input_token_details\": {\n      \"text_tokens\": 0,\n      \"audio_tokens\": 14\n
            \   },\n    \"output_tokens\": 45,\n    \"total_tokens\": 59\n  }\n}\n"
        - title: Diarization
          request:
            curl: "curl https://api.openai.com/v1/audio/transcriptions \\\n  -H \"Authorization: Bearer
              $OPENAI_API_KEY\" \\\n  -H \"Content-Type: multipart/form-data\" \\\n  -F file=\"@/path/to/file/meeting.wav\"
              \\\n  -F model=\"gpt-4o-transcribe-diarize\" \\\n  -F response_format=\"diarized_json\"
              \\\n  -F chunking_strategy=auto \\\n  -F 'known_speaker_names[]=agent' \\\n  -F 'known_speaker_references[]=data:audio/wav;base64,AAA...'\n"
            python: "import base64\nfrom openai import OpenAI\n\nclient = OpenAI()\n\ndef to_data_url(path:
              str) -> str:\n  with open(path, \"rb\") as fh:\n    return \"data:audio/wav;base64,\" +
              base64.b64encode(fh.read()).decode(\"utf-8\")\n\nwith open(\"meeting.wav\", \"rb\") as audio_file:\n
              \ transcript = client.audio.transcriptions.create(\n    model=\"gpt-4o-transcribe-diarize\",\n
              \   file=audio_file,\n    response_format=\"diarized_json\",\n    chunking_strategy=\"auto\",\n
              \   extra_body={\n      \"known_speaker_names\": [\"agent\"],\n      \"known_speaker_references\":
              [to_data_url(\"agent.wav\")],\n    },\n  )\n\nprint(transcript.segments)\n"
            javascript: "import fs from \"fs\";\nimport OpenAI from \"openai\";\n\nconst openai = new
              OpenAI();\n\nconst speakerRef = fs.readFileSync(\"agent.wav\").toString(\"base64\");\n\nconst
              transcript = await openai.audio.transcriptions.create({\n  file: fs.createReadStream(\"meeting.wav\"),\n
              \ model: \"gpt-4o-transcribe-diarize\",\n  response_format: \"diarized_json\",\n  chunking_strategy:
              \"auto\",\n  extra_body: {\n    known_speaker_names: [\"agent\"],\n    known_speaker_references:
              [`data:audio/wav;base64,${speakerRef}`],\n  },\n});\n\nconsole.log(transcript.segments);\n"
          response: "{\n  \"task\": \"transcribe\",\n  \"duration\": 27.4,\n  \"text\": \"Agent: Thanks
