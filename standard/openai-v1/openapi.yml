            \"transcript.text.segment\",\n      \"id\": \"seg_002\",\n      \"start\": 4.7,\n      \"end\":
            11.8,\n      \"text\": \"Hi, I'm trying to enable diarization.\",\n      \"speaker\": \"A\"\n
            \   },\n    {\n      \"type\": \"transcript.text.segment\",\n      \"id\": \"seg_003\",\n
            \     \"start\": 12.1,\n      \"end\": 18.5,\n      \"text\": \"Happy to walk you through
            the steps.\",\n      \"speaker\": \"agent\"\n    }\n  ],\n  \"usage\": {\n    \"type\": \"duration\",\n
            \   \"seconds\": 27\n  }\n}\n"
        - title: Streaming
          request:
            curl: "curl https://api.openai.com/v1/audio/transcriptions \\\n  -H \"Authorization: Bearer
              $OPENAI_API_KEY\" \\\n  -H \"Content-Type: multipart/form-data\" \\\n  -F file=\"@/path/to/file/audio.mp3\"
              \\\n  -F model=\"gpt-4o-mini-transcribe\" \\\n  -F stream=true\n"
            python: "from openai import OpenAI\nclient = OpenAI()\n\naudio_file = open(\"speech.mp3\",
              \"rb\")\nstream = client.audio.transcriptions.create(\n  file=audio_file,\n  model=\"gpt-4o-mini-transcribe\",\n
              \ stream=True\n)\n\nfor event in stream:\n  print(event)\n"
            javascript: "import fs from \"fs\";\nimport OpenAI from \"openai\";\n\nconst openai = new
