            - dall-e-3
            - gpt-image-1
            - gpt-image-1-mini
          x-oaiTypeLabel: string
          default: dall-e-2
          example: gpt-image-1.5
          nullable: true
          description: The model to use for image generation. One of `dall-e-2`, `dall-e-3`, or a GPT
            image model (`gpt-image-1`, `gpt-image-1-mini`, `gpt-image-1.5`, `gpt-image-2`, `gpt-image-2-2026-04-21`,
            `gpt-image-2.5-sunburst`, `gpt-image-2.5-sunburst-2026-09-08`, `gpt-image-2.5-flare`, `gpt-image-2.5-flare-2026-09-08`).
            Defaults to `dall-e-2` unless a parameter specific to the GPT image models is used.
        n:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
          example: 1
          nullable: true
          description: The number of images to generate. Must be between 1 and 10. For `dall-e-3`, only
            `n=1` is supported.
        quality:
          type: string
          enum:
          - standard
          - hd
          - low
          - medium
          - high
          - xhigh
          - max
          - auto
          default: auto
          example: medium
          nullable: true
          description: "The quality of the image that will be generated.\n\n- `auto` (default value) will
            automatically select the best quality for the given\n  model.\n- `high`, `medium` and `low`
            are supported for the GPT image models.\n- `gpt-image-2.5-sunburst` and `gpt-image-2.5-flare`,
            including their `2026-09-08`\n  snapshots, also support `xhigh` and `max`.\n- `hd` and `standard`
            are supported for `dall-e-3`.\n- `standard` is the only option for `dall-e-2`.\n"
        response_format:
          type: string
          enum:
          - url
          - b64_json
          default: url
          example: url
          nullable: true
          description: The format in which generated images with `dall-e-2` and `dall-e-3` are returned.
            Must be one of `url` or `b64_json`. URLs are only valid for 60 minutes after the image has
            been generated. This parameter isn't supported for the GPT image models, which always return
            base64-encoded images.
        output_format:
          type: string
          enum:
          - png
          - jpeg
          - webp
          default: png
          example: png
          nullable: true
          description: The format in which the generated images are returned. This parameter is only supported
            for the GPT image models. Must be one of `png`, `jpeg`, or `webp`.
        output_compression:
          type: integer
          default: 100
          example: 100
          nullable: true
          description: The compression level (0-100%) for the generated images. This parameter is only
            supported for the GPT image models with the `webp` or `jpeg` output formats, and defaults
            to 100.
        stream:
          type: boolean
          default: false
          example: false
          nullable: true
          description: 'Generate the image in streaming mode. Defaults to `false`. See the

            [Image generation guide](https://developers.openai.com/api/docs/guides/image-generation) for
            more information.

            This parameter is only supported for the GPT image models.

            '
        partial_images:
          $ref: '#/components/schemas/PartialImages'
        size:
          anyOf:
          - type: string
          - type: string
            enum:
            - auto
            - 1024x1024
            - 1536x1024
            - 1024x1536
            - 256x256
            - 512x512
            - 1792x1024
            - 1024x1792
          default: auto
          example: 1024x1024
          nullable: true
          description: The size of the generated images. For `gpt-image-2`, `gpt-image-2-2026-04-21`,
            `gpt-image-2.5-sunburst`, `gpt-image-2.5-sunburst-2026-09-08`, `gpt-image-2.5-flare`, and
            `gpt-image-2.5-flare-2026-09-08`, arbitrary resolutions are supported as `WIDTHxHEIGHT` strings,
            for example `1536x864`. Width and height must both be divisible by 16 and the requested aspect
            ratio must be between 1:3 and 3:1. Resolutions above `2560x1440` are experimental, and the
            maximum supported resolution is `3840x2160`. The requested size must also satisfy the model's
            current pixel and edge limits. The standard sizes `1024x1024`, `1536x1024`, and `1024x1536`
            are supported by the GPT image models; `auto` is supported for models that allow automatic
            sizing. For `dall-e-2`, use one of `256x256`, `512x512`, or `1024x1024`. For `dall-e-3`, use
            one of `1024x1024`, `1792x1024`, or `1024x1792`.
        moderation:
          type: string
          enum:
          - low
          - auto
          default: auto
          example: low
          nullable: true
          description: Control the content-moderation level for images generated by the GPT image models.
            Must be either `low` for less restrictive filtering or `auto` (default value).
        background:
          type: string
          enum:
          - transparent
          - opaque
          - auto
          default: auto
          example: transparent
          nullable: true
          description: 'Set the background of the generated image(s). This parameter is only supported
            for

            the GPT image models. Must be one of `transparent`, `opaque`, or `auto` (default

            value). When `auto` is used, the model will automatically determine the best

            background for the image.


            `gpt-image-2.5-sunburst` and `gpt-image-2.5-flare`, including their `2026-09-08`

            snapshots, support `opaque` and `transparent` backgrounds. Transparent backgrounds

            are available for supported GPT Image models. For `gpt-image-2` and

            `gpt-image-2-2026-04-21`, this support is in preview. When using `transparent`,

            set the output format to `png` or `webp`.

            '
        style:
          type: string
          enum:
          - vivid
          - natural
          default: vivid
          example: vivid
          nullable: true
          description: The style of the generated images. This parameter is only supported for `dall-e-3`.
            Must be one of `vivid` or `natural`. Vivid causes the model to lean towards generating hyper-real
            and dramatic images. Natural causes the model to produce more natural, less hyper-real looking
            images.
        user:
          type: string
          example: user-1234
          description: 'A unique identifier representing your end-user, which can help OpenAI to monitor
            and detect abuse. [Learn more](https://developers.openai.com/api/docs/guides/safety-best-practices#implement-safety-identifiers).

            '
      required:
      - prompt
