aid: standard-openai
name: Models
type: Standard
description: |-
  De facto standards for the model layer. The OpenAI API became an industry contract by
  being implemented by other people; this profiles that interface as adopters actually
  build it, grades every operation into core, extended and vendor tiers by measured
  adoption, and publishes a registry of who implements what.

  Core is two operations: POST /chat/completions and GET /models. Nothing else clears a
  third of the cohort.
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
